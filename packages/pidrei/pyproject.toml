[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei"
version = "0.84.2.4"
description = "pidrei coding agent CLI (port of pi coding-agent)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-agent==0.84.2.4",
    "pidrei-ai==0.84.2.4",
    "pidrei-client==0.84.2.4",
    "pidrei-protocol==0.84.2.4",
    "pidrei-tui==0.84.2.4",
    "tonio~=0.9.11",
    "pyyaml~=6.0",
    "jsonschema~=4.26",
    "pathspec~=1.1",
    "pillow~=12.3",
    "pygments~=2.20",
]

[tool.uv.sources]
pidrei-agent = { workspace = true }
pidrei-ai = { workspace = true }
pidrei-client = { workspace = true }
pidrei-protocol = { workspace = true }
pidrei-tui = { workspace = true }

[project.scripts]
pidrei = "pidrei.__main__:run"
# Short alias (open decision 11). The config dir stays ~/.pidrei — the alias is
# a convenience, not a second identity.
pi3 = "pidrei.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["pidrei"]
