[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei"
version = "0.1.0.dev0"
description = "pidrei coding agent CLI (port of pi coding-agent)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-agent",
    "pidrei-ai",
    "pidrei-tui",
    "tonio>=0.8.3",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pathspec>=0.12",
    "pillow>=11.0",
    "pygments>=2.18",
]

[tool.uv.sources]
pidrei-agent = { workspace = true }
pidrei-ai = { workspace = true }
pidrei-tui = { workspace = true }
# The local tonio checkout sets `tool.uv.package = false` for its own dev
# workflow; `package = true` forces uv to build/install it here anyway.
tonio = { path = "../../../tonio", package = true }

[project.scripts]
pidrei = "pidrei.__main__:run"
# Short alias (open decision 11). The config dir stays ~/.pidrei — the alias is
# a convenience, not a second identity.
pi3 = "pidrei.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["pidrei"]
