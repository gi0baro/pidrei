[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-mcp"
version = "1.0.0.0"
description = "Standalone Model Context Protocol client: stdio and Streamable HTTP transports, OAuth (port of pi-mcp)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-http==1.0.0.0",
    "pidrei-utils==1.0.0.0",
    "tonio~=0.10.4",
]

[tool.uv.sources]
pidrei-http = { workspace = true }
pidrei-utils = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_mcp"]
