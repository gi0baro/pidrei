[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-http"
version = "1.1.0.1"
description = "pidrei's HTTP seam: pooled clients, proxy resolution, PKCE and the loopback callback server"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "tonio~=0.10.4",
    "punkreq~=0.2.4",
    # punkreq's own transport, declared directly because the callback server
    # uses its server-side HTTP/1 connection and the WebSocket handshake its
    # client upgrade (http.py).
    "httpunk~=0.4.5",
]

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = ["pidrei_http"]
