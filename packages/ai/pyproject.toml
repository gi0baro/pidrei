[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-ai"
version = "1.5.2.0"
description = "Unified multi-provider LLM API layer of pidrei (port of pi-ai)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-http==1.5.2.0",
    "pidrei-utils==1.5.2.0",
    "tonio~=0.10.7",
    # Sans-io WebSocket frame codec only (no client, no asyncio): the Codex
    # responses transport drives it over httpunk's H1Upgraded, which the seam
    # hands back (utils/websocket.py).
    "websockets~=16.1",
    # Sans-io only: AWS credential resolution, SigV4 signing and the
    # vnd.amazon.eventstream frame decoder for Bedrock (api/bedrock_runtime.py).
    # punkreq still makes the request. Pure Python, so free-threading is safe by
    # construction. pi gets all three from @aws-sdk/client-bedrock-runtime.
    "botocore~=1.43",
    # RSA-SHA256 only, and only for Vertex AI service-account credentials: ADC
    # signs a JWT assertion to exchange for an access token (auth/google_adc.py).
    # pi gets this from google-auth-library via @google/genai.
    "cryptography~=49.0",
    # The engine under tool-argument validation (utils/schema/), and the
    # packages behind its checkers for the formats pi checks; all pure Python.
    # These are jsonschema's format-nongpl extra without rfc3987-syntax, whose
    # grammars cost ~0.65 s at every launch (jsonschema imports it whenever it
    # is installed); iri and iri-reference are checked in utils/schema/formats.py
    # instead. The extra's webcolors only checks draft 3's `color`.
    "jsonschema~=4.26",
    "fqdn~=1.5",
    "idna~=3.10",
    "isoduration~=20.11",
    "jsonpointer~=3.0",
    "rfc3339-validator~=0.1.4",
    "rfc3986-validator~=0.1.1",
    "uri-template~=1.3",
]

[tool.uv.sources]
pidrei-http = { workspace = true }
pidrei-utils = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_ai"]
