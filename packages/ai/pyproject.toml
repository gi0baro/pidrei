[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-ai"
version = "0.1.0.dev0"
description = "Unified multi-provider LLM API layer of pidrei (port of pi-ai)"
requires-python = ">=3.14"

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "tonio>=0.8.3",
    "punkreq~=0.1.1",
    "partial-json-parser>=0.2.1.1.post7",
]

[tool.uv.sources]
# The local tonio checkout sets `tool.uv.package = false` for its own dev
# workflow; `package = true` forces uv to build/install it here anyway.
tonio = { path = "../../../tonio", package = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_ai"]
