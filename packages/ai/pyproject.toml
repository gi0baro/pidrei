[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-ai"
version = "0.84.4.0"
description = "Unified multi-provider LLM API layer of pidrei (port of pi-ai)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "tonio~=0.9.14",
    "punkreq~=0.2.0",
    # punkreq's own transport, declared directly because the OAuth callback
    # servers use its server-side HTTP/1 connection (utils/http.py).
    "httpunk~=0.2.2",
    # Sans-io WebSocket frame codec only (no client, no asyncio): the Codex
    # responses transport drives it over httpunk's H1Upgraded (utils/websocket.py).
    "websockets~=16.1",
    # Sans-io only: AWS credential resolution, SigV4 signing and the
    # vnd.amazon.eventstream frame decoder for Bedrock (api/bedrock_runtime.py).
    # punkreq still makes the request. Pure Python, so free-threading is safe by
    # construction. pi gets all three from @aws-sdk/client-bedrock-runtime.
    "botocore~=1.43",
    # RSA-SHA256 only, and only for Vertex AI service-account credentials: ADC
    # signs a JWT assertion to exchange for an access token (auth/google_adc.py).
    # pi gets this from google-auth-library via @google/genai.
    "cryptography~=49.0",
    "partial-json-parser~=0.2.1",
    "jsonschema~=4.26",
]

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = ["pidrei_ai"]
