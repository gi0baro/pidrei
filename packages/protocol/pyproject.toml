[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-protocol"
version = "0.84.4.1"
# Workspace-only transport remnant (CBOR + framing); not published — see
# UPSTREAM_EXPERIMENTAL_RULING.md.
description = "CBOR and framing transport layer of pidrei (port of pi-protocol's transport half)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]

# Dependency-free by design: CBOR and framing are hand-ported, sans-io.
dependencies = []

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = ["pidrei_protocol"]
