[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-protocol"
version = "0.84.2.3"
description = "Transport-neutral CBOR protocol for remote sessions of pidrei (port of pi-protocol)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # pi validates wire messages with TypeBox; the established mapping
    # (model_config.py, pidrei_ai/utils/validation.py) is hand-rolled JSON
    # Schema dicts run through `jsonschema`. Everything else is dependency-free
    # by design: CBOR and framing are hand-ported, sans-io.
    "jsonschema~=4.26",
]

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = ["pidrei_protocol"]
