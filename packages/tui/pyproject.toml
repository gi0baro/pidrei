[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-tui"
version = "0.84.1.0"
description = "pidrei terminal UI package: terminal driver, input stack, renderer and components (port of pi tui)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "grapheme~=0.6.0",
    "jieba~=0.42.1",
    "linkify-it-py~=2.1",
    "markdown-it-py~=4.2",
    "tonio~=0.9.6",
    "uniseg~=0.10.1",
]

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = ["pidrei_tui"]
