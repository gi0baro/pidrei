[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-server"
version = "0.1.0.dev0"
description = "pidrei server package: unix-socket supervisor for headless instances (port of pi-server)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei",
    "pidrei-ai",
    "tonio>=0.8.3",
]

[tool.uv.sources]
pidrei = { workspace = true }
pidrei-ai = { workspace = true }
# The local tonio checkout sets `tool.uv.package = false` for its own dev
# workflow; `package = true` forces uv to build/install it here anyway.
tonio = { path = "../../../tonio", package = true }

[project.scripts]
pidrei-server = "pidrei_server.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["pidrei_server"]
