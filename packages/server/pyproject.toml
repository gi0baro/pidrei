[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-server"
version = "0.84.2.1"
description = "pidrei server package: composable session protocol server (port of pi-server)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-ai==0.84.2.1",
    "pidrei-protocol==0.84.2.1",
    "tonio~=0.9.7",
]

[tool.uv.sources]
pidrei-ai = { workspace = true }
pidrei-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_server"]
