[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-server"
version = "0.84.4.1"
# Workspace-only transport remnant (unix listener + byte-connection
# contracts); not published — see UPSTREAM_EXPERIMENTAL_RULING.md.
description = "Unix-socket listener layer of pidrei's server package (port of pi-server's transport half)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]

dependencies = [
    "pidrei-protocol",
    "tonio~=0.9.15",
]

[tool.uv.sources]
pidrei-protocol = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_server"]
