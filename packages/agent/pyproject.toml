[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-agent"
version = "0.82.0.0"
description = "Agent loop, harness and core tools of pidrei (port of pi-agent-core)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-ai==0.82.0.0",
    "tonio~=0.9.1",
    "pyyaml~=6.0",
    "pathspec~=1.1",
]

[tool.uv.sources]
pidrei-ai = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_agent"]
