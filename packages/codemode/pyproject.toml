[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pidrei-codemode"
version = "1.1.0.2"
description = "Sandboxed Python execution where the only capability is calling injected tools (port of pi-codemode)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Giovanni Barillari", email = "g@baro.dev" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pidrei-utils==1.1.0.2",
    "pydantic-monty~=1.1.0",
    "tonio~=0.10.4",
]

[tool.uv.sources]
pidrei-utils = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["pidrei_codemode"]
