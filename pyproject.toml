[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
lint = [
    "ruff~=0.16.0",
]
test = [
    "pyte~=0.8.2",
    "pytest~=9.1",
]

[tool.uv]
default-groups = ["lint", "test"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
addopts = "--import-mode=importlib"
# A test that runs this long has wedged (the slowest legitimate test is ~1s).
# pytest then dumps every thread's stack to stderr and lets the test go on,
# so a CI job timeout still kills the run but the log says where it hung —
# the only evidence a lost wakeup ever leaves (TONIO_BUGS #10 came from one).
faulthandler_timeout = 30

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = 'double'

[tool.ruff.lint]
extend-select = [
    # E and F are enabled by default
    'B',      # flake8-bugbear
    'C4',     # flake8-comprehensions
    'C90',    # mccabe
    'I',      # isort
    'N',      # pep8-naming
    'Q',      # flake8-quotes
    'RUF100', # ruff (unused noqa)
    'S',      # flake8-bandit
    'T20',    # flake8-print: stdio goes through core/output_guard
    'TID251', # banned-api (below)
    'W',      # pycodestyle
]
extend-ignore = [
    'B006',   # mutable function args are fine
    'B008',   # function calls in args defaults are fine
    'B009',   # getattr with constants is fine
    'B904',   # rising without from is fine
    'BLE001', # catch-all fallbacks mirror pi's error handling
    'E731',   # assigning lambdas is fine
    'F403',   # import * is fine
    'N818',   # leave to us exceptions naming
    'S101',   # assert is fine
    'S110',   # silent best-effort catches mirror pi's error handling
    'TRY002', # plain Exceptions mirror pi's `throw new Error(...)`
]
mccabe = { max-complexity = 45 }

# Writing through them is a synchronous write on the runtime: every stdio write
# goes through `pidrei.core.output_guard` instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
'sys.stdout'.msg = 'use pidrei.core.output_guard (write_stdout/write_raw_stdout/stdout_isatty)'
'sys.stderr'.msg = 'use pidrei.core.output_guard.write_stderr'
'sys.__stdout__'.msg = 'use pidrei.core.output_guard'
'sys.__stderr__'.msg = 'use pidrei.core.output_guard'
'traceback.print_exc'.msg = 'format the traceback and use pidrei.core.output_guard.write_stderr'
'traceback.print_exception'.msg = 'format the traceback and use pidrei.core.output_guard.write_stderr'
'traceback.print_stack'.msg = 'format the stack and use pidrei.core.output_guard.write_stderr'
'traceback.print_tb'.msg = 'format the traceback and use pidrei.core.output_guard.write_stderr'
'traceback.print_last'.msg = 'format the traceback and use pidrei.core.output_guard.write_stderr'
# Clock reads go through the one seam every package shares (tests fake it by
# swapping `clock.now_ms` / `clock.monotonic`): `pidrei_utils.clock`.
'time.monotonic'.msg = 'use pidrei_utils.clock.monotonic (the runtime clock)'
'time.monotonic_ns'.msg = 'use pidrei_utils.clock.monotonic (the runtime clock)'
'time.perf_counter'.msg = 'use pidrei_utils.clock.monotonic (the runtime clock)'
'time.perf_counter_ns'.msg = 'use pidrei_utils.clock.monotonic (the runtime clock)'
'time.time'.msg = 'use pidrei_utils.clock.now_ms'
'time.time_ns'.msg = 'use pidrei_utils.clock.now_ms'
'time.strftime'.msg = 'format clock.now_datetime(), or datetime.fromtimestamp(ts) for a stored time'
'datetime.datetime.now'.msg = 'use pidrei_utils.clock.now_datetime/now_iso'
'datetime.datetime.utcnow'.msg = 'use pidrei_utils.clock.now_datetime/now_iso'
'datetime.datetime.today'.msg = 'use pidrei_utils.clock.now_datetime'
'datetime.date.today'.msg = 'use pidrei_utils.clock.now_datetime'

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ['pidrei', 'pidrei_agent', 'pidrei_ai', 'pidrei_client', 'pidrei_codemode', 'pidrei_http', 'pidrei_mcp', 'pidrei_protocol', 'pidrei_server', 'pidrei_tui', 'pidrei_utils', 'tests']

[tool.ruff.lint.per-file-ignores]
# S105/S106: the OAuth mirrors are full of token URLs and fixture tokens named
# `*_token`, all of which trip ruff's hardcoded-password heuristic.
'packages/*/tests/**' = ['ASYNC230', 'B017', 'B018', 'E711', 'E712', 'F841', 'S103', 'S105', 'S106', 'S108', 'S110', 'T20', 'TID251']
# Standalone scripts: run outside pidrei's runtime, stdio is theirs.
'packages/*/scripts/**' = ['T20', 'TID251']
'packages/pidrei/pidrei/examples/extensions/custom_provider_gitlab_duo/test.py' = ['T20', 'TID251']
# The clock seam itself.
'packages/utils/pidrei_utils/clock.py' = ['TID251']
# S608 false positive: the --help template contains "update ... Update" lines
# that pattern-match ruff's SQL heuristic inside a multiline f-string, where
# no noqa comment can be placed outside the string.
'packages/pidrei/pidrei/cli/args.py' = ['S608']
# S105 false positives: markdown token dispatch compares variables named
# token_type/next_token_type against literals like "codespan", which trips
# ruff's hardcoded-password heuristic.
'packages/tui/pidrei_tui/components/markdown.py' = ['S105']
