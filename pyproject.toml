[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
lint = [
    "ruff~=0.11",
]
test = [
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["lint", "test"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = 'double'

[tool.ruff.lint]
extend-select = [
    # E and F are enabled by default
    'B',      # flake8-bugbear
    'C4',     # flake8-comprehensions
    'C90',    # mccabe
    'I',      # isort
    'N',      # pep8-naming
    'Q',      # flake8-quotes
    'RUF100', # ruff (unused noqa)
    'S',      # flake8-bandit
    'W',      # pycodestyle
]
extend-ignore = [
    'B006', # mutable function args are fine
    'B008', # function calls in args defaults are fine
    'B009', # getattr with constants is fine
    'B904', # rising without from is fine
    'E731', # assigning lambdas is fine
    'F403', # import * is fine
    'N818', # leave to us exceptions naming
    'S101', # assert is fine
]
mccabe = { max-complexity = 44 }

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
known-first-party = ['pppi', 'pppi_agent', 'pppi_ai', 'pppi_server', 'pppi_tui', 'tests']

[tool.ruff.lint.per-file-ignores]
'packages/*/tests/**' = ['B017', 'B018', 'E711', 'E712', 'F841', 'S110']
